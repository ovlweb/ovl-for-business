[package]
name = "ovl-business"
version = "0.1.0"
description = "OVL For Business desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ovl_business_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
