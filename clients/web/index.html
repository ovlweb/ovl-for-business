<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d6cdf" />
    <meta
      name="description"
      content="OVL For Business — corporate accounts, licenses, registry, stock exchange and messaging"
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>OVL For Business</title>
    <!-- Paint the last used theme before the app loads, so there is no flash. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('ovl.theme.vars') || 'null');
        if (t) {
          for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k]);
          document.documentElement.dataset.mode = t.mode;
          document.documentElement.dataset.theme = t.id;
        }
      } catch (e) {}
    </script>
    <!-- Runtime configuration (API URL). Overwritten by the Docker image entrypoint. -->
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
