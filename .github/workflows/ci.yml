name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ovl
          POSTGRES_PASSWORD: ovl
          POSTGRES_DB: ovl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ovl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ovl:ovl@localhost:5432/ovl_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @ovl/shared test
      - run: pnpm --filter @ovl/server test
      - run: pnpm --filter @ovl/server build
      - run: pnpm --filter @ovl/web build
      - run: pnpm --filter @ovl/admin build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ovl
          POSTGRES_PASSWORD: ovl
          POSTGRES_DB: ovl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ovl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://ovl:ovl@localhost:5432/ovl_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovl/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      OWNER_PASSWORD: ci-owner-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/health
          curl -fs -o /dev/null http://localhost:8081/
          curl -fs -X POST http://localhost:8080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d "{\"login\":\"owner\",\"password\":\"$OWNER_PASSWORD\"}" > /dev/null
      - if: always()
        run: docker compose logs api --tail 100 && docker compose down -v
