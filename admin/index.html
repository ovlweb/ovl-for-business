<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#16181d" />
    <title>OVL Admin</title>
    <!-- Paint the last used theme before the app loads, so there is no flash. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('ovl.theme.vars') || 'null');
        if (t) {
          for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k]);
          document.documentElement.dataset.mode = t.mode;
          document.documentElement.dataset.theme = t.id;
        }
      } catch (e) {}
    </script>
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
